[project]
name = "jira-triage"
version = "0.1.0"
description = "Defect triage agent for Jira Cloud"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32.0",
    "python-dotenv>=1.0.1",
    "chromadb>=1.0.0",
    "sentence-transformers>=3.0.0",
    "streamlit>=1.40.0",
    "google-genai>=1.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
